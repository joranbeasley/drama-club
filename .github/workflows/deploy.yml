# Deploys the app (Worker + static files + D1 database) to Cloudflare on every push to the
# default branch. One-time setup, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN  (Account: Workers Scripts Edit, D1 Edit, Account Settings Read)
#              CLOUDFLARE_ACCOUNT_ID
#   GOOGLE_CLIENT_ID (and optionally ALLOWED_EMAILS, ALLOWED_DOMAINS): as variables or secrets
# Until the token is set, the deploy is skipped (tests still run).
name: Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping deploy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see .github/workflows/deploy.yml)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci && npm run build
      - name: Find or create the D1 database
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/ensure-d1.mjs
      - name: Migrate the database
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply dramaclub --remote
      - name: Deploy the Worker
        id: deploy
        if: steps.ready.outputs.ok == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS || secrets.ALLOWED_EMAILS }}
          ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS || secrets.ALLOWED_DOMAINS }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is not set: the app will work, but only without an account (browser storage)."
          fi
          npx wrangler deploy \
            --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID" \
            --var "ALLOWED_EMAILS:$ALLOWED_EMAILS" \
            --var "ALLOWED_DOMAINS:$ALLOWED_DOMAINS" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

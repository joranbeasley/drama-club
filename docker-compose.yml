# Local Postgres (and, with --profile app, the app itself).
#   docker compose up -d db          # just the database, for npm run dev
#   docker compose --profile app up  # database + app on http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dramaclub
      POSTGRES_PASSWORD: dramaclub
      POSTGRES_DB: dramaclub
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  app:
    profiles: [app]
    build: .
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://dramaclub:dramaclub@db:5432/dramaclub
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # Behind plain http locally; drop this line once you serve over https.
      NODE_ENV: development
volumes:
  dbdata:
